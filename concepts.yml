context: fleet
name: Fleet and Telematics
intro: >-
  The common fleet vocabulary -- vehicles, the drivers who drive them, the trips they make,
  the locations they report, the geofences around them and the inspections that keep them
  safe -- distilled from the APIs that already exist.
tags: [Fleet Management, Telematics, Connected Vehicles, Fleet, Vehicle Tracking, GPS Tracking, ELD]

envelope: [_links, _pagination, _results, data, success, errors, warnings, count, total, page, meta, links,
           value, results, next, previous, has_more, message, status_code, ids, next_page, previous_page,
           page_info, cursor, total_count, per_page, total_pages, current_page, object, url, pagination]

common_fields:
  id: [uuid, guid, object_id, record_id, external_id, external_ids]
  created_at: [created, created_date, date_created, create_time, creation_date, created_on]
  updated_at: [updated, updated_date, modified_at, last_modified, date_modified, update_time, modified_date, modified]
  metadata: [meta_data, custom_fields, custom, attributes, properties, tags]
  status: [state, vehicle_status, driver_status, active, is_active]
  name: [title, display_name, label, nickname]
  vehicle_id: [vehicle, asset_id, unit_id, device_id, vehicle_ids]
  driver_id: [driver, operator_id, user_id, employee_id]
  latitude: [lat]
  longitude: [lng, lon, long]
  timestamp: [time, recorded_at, gps_time, date_time, datetime, event_time, ts]

concepts:
  vehicle:
    segments: [vehicles, vehicle, assets@fleet|fleets|telematics, units@fleet, trucks, cars]
    aliases:
      vin: [vehicle_identification_number, serial_number]
      make: [manufacturer, brand]
      model: [model_name]
      year: [model_year, year_of_manufacture]
      license_plate: [plate, license_plate_number, registration, registration_number, number_plate]
      odometer: [mileage, odometer_reading, odometer_meters, distance_traveled]
      fuel_type: [fuel, engine_type, powertrain]
  driver:
    requires: [vehicle]
    segments: [drivers, driver, operators@fleet|vehicles]
    aliases:
      first_name: [firstname, given_name]
      last_name: [lastname, surname, family_name]
      email: [email_address, emails]
      phone: [phone_number, mobile]
      license_number: [driver_license_number, licence_number, license, drivers_license]
      license_state: [driver_license_state, licence_state, license_region]
  trip:
    requires: [vehicle]
    segments: [trips, trip, journeys, journey, routes@vehicles|drivers]
    aliases:
      start_at: [start_time, started_at, start, start_date, start_timestamp]
      end_at: [end_time, ended_at, end, end_date, end_timestamp]
      start_location: [start_address, origin, from, start_position]
      end_location: [end_address, destination, to, end_position]
      distance: [distance_meters, distance_km, distance_miles, mileage, odometer_delta]
      duration: [duration_seconds, drive_time, elapsed_time]
  vehicle_location:
    requires: [vehicle]
    path: /vehicles/{vehicle_id}/locations
    segments: [locations@vehicles|vehicle|assets|devices, positions, position, gps, gps_points, breadcrumbs, location_history]
    aliases:
      speed: [speed_kmh, speed_mph, speed_miles_per_hour, velocity]
      heading: [bearing, course, direction]
      address: [reverse_geo, formatted_address, location_description]
  geofence:
    requires: [vehicle]
    segments: [geofences, geofence, zones, zone, places@fleet, landmarks]
    aliases:
      geometry: [polygon, circle, shape, boundary, coordinates, points]
      radius: [radius_meters, radius_m]
  inspection:
    requires: [vehicle]
    segments: [inspections, inspection, dvirs, dvir, vehicle_inspections]
    aliases:
      defects: [defect_list, issues, faults]
      safe_to_operate: [is_safe, vehicle_condition, condition]
      inspected_at: [inspection_time, completed_at, start_time]

exclude:
  geofence:
    toro: /irrigation/zones are sprinkler zones
    autopay: /status/v1/zone is a parking zone status

findings:
  - "A vehicle agrees on its VIN, make, model and id -- the most physical core in the commons:
    the identity of a vehicle is fixed by the vehicle, not by the software."
  - "A vehicle location agrees completely where it is published (latitude, longitude, speed,
    timestamp), but only three providers publish it as a resource; most stream it."
  - "Fleet is thin overall (29 providers expose vehicles): telematics platforms gate their APIs
    to customers and integration partners."
decisions:
  - "Locations count only beneath a vehicle, asset or device; a bare `/locations` is a store or a
    work site in other contexts. GPS points, positions and breadcrumbs are vehicle locations."
  - "Journeys are trips; zones, places and landmarks are geofences; DVIRs are inspections."
  - "Drivers, trips, locations, geofences and inspections `require: [vehicle]`, so a delivery
    network's drivers or an irrigation system's zones do not count."
